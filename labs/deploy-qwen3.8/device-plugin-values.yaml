# NVIDIA device plugin + GFD (auto-installs NFD) — design §5 step 3.
# Helm: helm upgrade -i nvidia-device-plugin nvdp/nvidia-device-plugin \
#         -n nvidia-device-plugin --create-namespace --version 0.19.x -f device-plugin-values.yaml
gfd:
  enabled: true            # GFD labels (nvidia.com/gpu.product, cuda.driver.*, …) — A4
nfd:
  enabled: true            # NFD prerequisite; set false if NFD already runs cluster-wide
toolkit:
  enabled: false           # host AL2023-NVIDIA AMI already ships the container toolkit (A7)
# Select GPU nodes: nodeadm (EKS accelerated AMI) sets nvidia.com/gpu.present=true at boot (A7)
nodeSelector:
  nvidia.com/gpu.present: "true"
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
# MOFED: plugin >=0.19 mounts /dev/infiniband/* into GPU containers by default (A5 trap).
# Harmless in this 1-GPU phase (no EFA devices present). For phase-2 multi-node w/ EFA,
# disable MOFED so the EFA device plugin owns those devices — via the plugin's config args:
#   args: ["--mofed-enabled=false"]   # [V chart support for args passthrough at install time]
