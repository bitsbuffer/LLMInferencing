# EC2NodeClass — AL2023 accelerated (NVIDIA) AMI auto-selected per instance type.
# [V first launch]: Karpenter's al2023@latest alias resolves the x86_64 NVIDIA variant for GPU
# instance types. Fallback: replace with an explicit SSM parameter, e.g. Bottlerocket:
#   {ssmParameter: /aws/service/bottlerocket/aws-k8s-1.36-nvidia/x86_64/latest/image_id}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: al2023-nvidia
spec:
  # Created in README step 2 (KarpenterNodeRole-infer-lab)
  role: KarpenterNodeRole-infer-lab

  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: infer-lab }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: infer-lab }

  amiSelectorTerms:
    - alias: al2023@latest              # Karpenter filters to the NVIDIA variant for GPU types

  # 100 GiB root is plenty for the OS; weights live on S3 + instance NVMe scratch (g6e/g7e
  # ship 1.9 TB local NVMe — usable later as a warm-pool cache via hostPath).
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: { volumeSize: 100Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true }

  kubelet:
    maxPods: 40                         # plenty for 1-GPU serving pods + system
  # Fine-grained kubelet tuning (A6/A9) can be added later (eviction thresholds, kubeReserved).
