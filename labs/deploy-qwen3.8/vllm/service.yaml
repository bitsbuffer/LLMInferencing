# In-cluster Service. Expose per environment (Gateway API HTTPRoute / ALB Ingress / port-forward
# for the pilot). Put auth (API key) at the gateway, not in vLLM (L7 checklist, design D7).
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm
  labels: { app: vllm-qwen3-8-27b }
spec:
  selector: { app: vllm-qwen3-8-27b }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
