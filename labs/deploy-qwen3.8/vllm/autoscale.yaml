# Burst replicas on the SPOT NodePool: create a second Deployment (copy) with
#   replicas: 0 + KEDA min 0/max 2 + nodeSelector tier=burst + toleration key burst=true
# and REMOVE karpenter.sh/do-not-disrupt (A9: baseline=on-demand protected, burst=spot).
